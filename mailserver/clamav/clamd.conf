Foreground yes
User clamav
LogTime yes
# Без LogFile: під непривілейованим користувачем /dev/stdout недоступний; помилки йдуть у stderr
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 8
ReadTimeout 300
CommandReadTimeout 30
# Має бути >= CLAMAV_MAX_STREAM_MB у backend
StreamMaxLength 2000M
MaxScanSize 4000M
MaxFileSize 2000M
MaxRecursion 16
MaxFiles 20000
ScanArchive yes
AlertEncrypted no
AlertBrokenExecutables yes
DetectPUA yes
ExitOnOOM yes
DatabaseDirectory /var/lib/clamav
