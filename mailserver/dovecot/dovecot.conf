# BlackCloud — Dovecot 2.3
protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
auth_verbose_passwords = no

# ─── TLS ───
# Назовні опубліковано лише 993 (implicit TLS). Порт 143 — тільки для
# внутрішньої мережі (веб-пошта Django), тому plaintext-автентифікація дозволена.
ssl = yes
ssl_cert = </etc/dovecot/tls/fullchain.pem
ssl_key = </etc/dovecot/tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
disable_plaintext_auth = no
auth_mechanisms = plain login

# ─── Сховище ───
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail
mail_plugins = $mail_plugins quota
# Шифрування листів на диску (mail_crypt, глобальні EC-ключі) — вмикає entrypoint.sh,
# якщо в secrets/ є mail_crypt_private_key і mail_crypt_public_key
!include_try /etc/dovecot/mail-crypt.conf

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ─── Автентифікація ───
# Master-user для веб-пошти: логін "<адреса>*webmail", дозволено лише з внутрішньої мережі.
auth_master_user_separator = *
passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
}
# Звичайні користувачі: окремий пароль для поштових клієнтів (Argon2id)
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ─── Сервіси ───
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 1
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL для Postfix (submission)
service auth {
  inet_listener sasl {
    port = 12345
  }
}

service auth-worker {
  # Argon2id потребує пам'яті
  vsz_limit = 512M
}

# Захист від перебору: затримка після невдалих спроб
auth_failure_delay = 3 secs

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 30
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@localhost
}

plugin {
  quota = maildir:User quota
  quota_exceeded_message = Mailbox is full / Скринька переповнена
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
  sieve_before = /etc/dovecot/sieve/spam-to-junk.sieve
}
