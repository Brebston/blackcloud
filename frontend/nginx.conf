server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Хешовані бандли кешуються назавжди
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: service worker і маніфест завжди перевіряються на оновлення
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # «Поділитися → BlackCloud» обробляє service worker; якщо він ще не активний — просто відкриваємо «Файли»
    location = /share-target {
        absolute_redirect off;
        return 303 /files;
    }

    # SPA: усі інші шляхи → index.html
    location / {
        try_files $uri /index.html;
    }
}
