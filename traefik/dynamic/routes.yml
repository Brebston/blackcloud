{{ $domain := env "DOMAIN" }}
{{ $resolver := env "TLS_RESOLVER" }}
{{ $office := env "OFFICE_HOST" | default (printf "office.%s" $domain) }}
{{ $uc := env "USERCONTENT_HOST" | default (printf "usercontent.%s" $domain) }}
http:
  routers:
    api:
      rule: 'Host(`{{ $domain }}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/django-static`) || PathPrefix(`/{{ env "ADMIN_URL_PREFIX" | default "bc-admin" }}`))'
      entryPoints: [websecure]
      service: backend
      middlewares: [security-headers, api-csp]
      priority: 100
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}
        domains:
          - main: '{{ $domain }}'

    # Суворий ліміт — лише на ендпоінти, що перевіряють облікові дані. /api/auth/me і /csrf
    # SPA викликає часто (оновлення квоти під час завантажень); 429 на них «викидав» з акаунта.
    auth:
      rule: 'Host(`{{ $domain }}`) && (PathPrefix(`/api/auth/login`) || PathPrefix(`/api/auth/register`))'
      entryPoints: [websecure]
      service: backend
      middlewares: [security-headers, api-csp, auth-ratelimit]
      priority: 200
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

    # WebDAV (мережевий диск): HTTP Basic з паролем застосунку. Finder робить сотні PROPFIND
    # поспіль, тож ліміт частоти вищий, ніж для /api/auth. Тіло не буферизується (немає
    # middleware buffering): великі PUT ідуть потоком, ліміт розміру перевіряє backend.
    dav:
      rule: 'Host(`{{ $domain }}`) && (Path(`/dav`) || PathPrefix(`/dav/`))'
      entryPoints: [websecure]
      # Окремий сервіс dav: навантаження від WebDAV не впливає на вебінтерфейс
      service: dav
      middlewares: [security-headers, api-csp, dav-ratelimit]
      priority: 120
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

    public-links:
      rule: 'Host(`{{ $domain }}`) && PathPrefix(`/api/public`)'
      entryPoints: [websecure]
      service: backend
      middlewares: [security-headers, api-csp, public-ratelimit]
      priority: 150
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

    # HTML листів (і конфіденційних листів) рендериться в sandbox-iframe того ж origin; CSP задає сам Django
    mail-render:
      rule: 'Host(`{{ $domain }}`) && (PathPrefix(`/api/mail/render`) || PathPrefix(`/api/public/confidential/r/`))'
      entryPoints: [websecure]
      service: backend
      middlewares: [security-headers-framable]
      priority: 300
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

    # Внутрішні ендпоінти ONLYOFFICE (file/, callback/) викликає лише Document Server
    # напряму через Docker-мережу. Ззовні вони закриті (403).
    office-internal-deny:
      rule: 'Host(`{{ $domain }}`) && (PathPrefix(`/api/office/file/`) || PathPrefix(`/api/office/callback/`))'
      entryPoints: [websecure]
      service: backend
      middlewares: [deny-all]
      priority: 500
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

    # ONLYOFFICE Document Server на окремому піддомені: його JavaScript працює в іншому
    # origin і не може читати cookie, CSRF-токен чи API основного сайту.
    office:
      rule: 'Host(`{{ $office }}`)'
      entryPoints: [websecure]
      service: office
      middlewares: [office-headers]
      priority: 400
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}
        domains:
          - main: '{{ $office }}'

    # Перегляд файлів користувачів у браузері (PDF, відео, текст) — окремий origin.
    # Тут доступний ЛИШЕ /api/preview/<квиток>/; решта шляхів → 404.
    usercontent:
      rule: 'Host(`{{ $uc }}`) && PathPrefix(`/api/preview/`)'
      entryPoints: [websecure]
      service: backend
      middlewares: [usercontent-headers]
      priority: 400
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}
        domains:
          - main: '{{ $uc }}'

    {{ $mail := env "MAIL_HOSTNAME" }}
    {{ if and $resolver $mail }}
    # Лише для того, щоб Traefik отримав сертифікат Let's Encrypt для поштового хоста
    # (його забирає сервіс certdumper для Postfix/Dovecot). Веб-запити → на основний домен.
    mail-cert:
      rule: 'Host(`{{ $mail }}`)'
      entryPoints: [websecure]
      service: frontend
      middlewares: [to-main-domain]
      priority: 50
      tls:
        certResolver: {{ $resolver }}
        domains:
          - main: '{{ $mail }}'
    {{ end }}

    {{ $mtasts := env "MTA_STS_MODE" }}
    {{ $maildomain := env "MAIL_DOMAIN" | lower }}
    {{ if and $resolver $mtasts $maildomain }}
    # MTA-STS (docs/MAIL.md): на хості mta-sts.<MAIL_DOMAIN> доступний ЛИШЕ файл політики,
    # решта шляхів — 404. Вмикається MTA_STS_MODE у .env (спершу A-запис mta-sts → сервер).
    mta-sts:
      rule: 'Host(`mta-sts.{{ $maildomain }}`) && Path(`/.well-known/mta-sts.txt`)'
      entryPoints: [websecure]
      service: backend
      middlewares: [security-headers, api-csp]
      priority: 400
      tls:
        certResolver: {{ $resolver }}
        domains:
          - main: 'mta-sts.{{ $maildomain }}'
    {{ end }}

    frontend:
      rule: 'Host(`{{ $domain }}`)'
      entryPoints: [websecure]
      service: frontend
      middlewares: [security-headers, spa-csp]
      priority: 1
      tls:
        {{ if $resolver }}certResolver: {{ $resolver }}{{ end }}

  services:
    # Без healthCheck у Traefik: сервер лише один, і одна повільна відповідь /api/health/
    # (під навантаженням) вимикала його повністю — «no available server» (503) для всіх.
    # Стан контейнерів і так перевіряє Docker healthcheck (5 спроб) та моніторинг.
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8000
    dav:
      loadBalancer:
        servers:
          - url: http://dav:8000
    office:
      loadBalancer:
        servers:
          - url: http://onlyoffice:80
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080

  middlewares:
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: same-origin
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()'
        customResponseHeaders:
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Resource-Policy: same-origin
          X-Permitted-Cross-Domain-Policies: none
          Server: ''
          X-Powered-By: ''

    security-headers-framable:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        customFrameOptionsValue: SAMEORIGIN

    to-main-domain:
      redirectRegex:
        regex: '^https?://[^/]+/(.*)'
        replacement: 'https://{{ $domain }}/${1}'
        permanent: true

    deny-all:
      ipAllowList:
        sourceRange: ["127.0.0.1/32"]

    office-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: same-origin
        customRequestHeaders:
          X-Forwarded-Proto: https
        customResponseHeaders:
          # Редактор вбудовується лише в основний сайт
          Content-Security-Policy: "frame-ancestors 'self' https://{{ $domain }}"
          X-Frame-Options: ''

    usercontent-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
        # Мапа лише з порожніми значеннями — для Traefik «standalone element», тому є непорожній заголовок
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: none
          Server: ''

    spa-csp:
      headers:
        # script-src: з піддомену ONLYOFFICE дозволено ЛИШЕ завантажувач api.js
        # (точний шлях, а не весь хост). Сам редактор працює в iframe (frame-src).
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' https://{{ $office }}/web-apps/apps/api/documents/api.js;
          style-src 'self';
          img-src 'self' data: blob: https://{{ $uc }};
          media-src 'self' https://{{ $uc }};
          font-src 'self';
          connect-src 'self' wss://{{ $domain }} https://{{ $office }};
          frame-src 'self' blob: https://{{ $office }} https://{{ $uc }};
          object-src 'none';
          base-uri 'none';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests

    api-csp:
      headers:
        contentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'; sandbox"

    auth-ratelimit:
      rateLimit:
        average: 10
        period: 1m
        burst: 10

    # Finder на кожен файл робить ~10 запитів (PROPFIND, LOCK, порожній PUT, PUT, PROPPATCH,
    # UNLOCK, плюс службові ._-файли): копіювання кількох сотень фото впиралось у ліміт (429).
    # Підбір пароля обмежує окреме блокування в apps/dav/auth.py, а не цей ліміт.
    dav-ratelimit:
      rateLimit:
        average: 3000
        period: 1m
        burst: 1500

    public-ratelimit:
      rateLimit:
        average: 60
        period: 1m
        burst: 20

tls:
  {{ if env "LOCAL_TLS_CERT" }}
  # Лише для локальної розробки (docker-compose.dev.yml): довірений сертифікат mkcert
  # замість самопідписаного — без нього браузер не реєструє service worker, а Finder — WebDAV
  stores:
    default:
      defaultCertificate:
        certFile: {{ env "LOCAL_TLS_CERT" }}
        keyFile: {{ env "LOCAL_TLS_KEY" }}
  {{ end }}
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: {{ env "SNI_STRICT" | default "true" }}
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
